name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" "buildozer==1.5.0"

      - name: Setup SDK, Tools and Android API 31
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/build-tools"
          
          # Copiem build-tools și cmdline-tools
          cp -r $ANDROID_HOME/build-tools/* "$SDK_DIR/build-tools/"
          cp -r $ANDROID_HOME/cmdline-tools "$SDK_DIR/"
          
          # Wrapper sdkmanager
          echo '#!/bin/bash' > "$SDK_DIR/tools/bin/sdkmanager"
          echo 'exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$@"' >> "$SDK_DIR/tools/bin/sdkmanager"
          chmod +x "$SDK_DIR/tools/bin/sdkmanager"

          # Instalăm platforma Android 31 cerută de Buildozer
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK_DIR" "platforms;android-31" "platform-tools" || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateCalculator-APK
          path: bin/*.apk
